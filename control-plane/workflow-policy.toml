[policy]
version = 1
review_bundle_max_bytes = 262144

[controller]
backend = "hermes"
provider = "nous_portal"
model = "openai/gpt-5.4"
can_plan = false
can_review = false
can_merge = false

# Témoin hors chemin quotidien (ADR-0017). Hermes ou le propriétaire
# l'appelle ; ce n'est pas le juge de chaque PR.
[witness]
backend = "claude"
model = "claude-opus-5"
effort = "high"

[classification]
# R0 est volontairement étroit : ces chemins ne peuvent rester R0 que si
# tous les fichiers du lot correspondent à cette liste et à aucune règle R2.
# R0 = aucun agent : ni planificateur, ni exécutant, ni relecteur. Réservé
# à ce qui ne peut casser ni le jeu, ni les règles, ni le pilotage.
#
# Un lot n'est R0 que si TOUS ses fichiers correspondent à cette liste ET
# qu'aucun ne touche `r2_paths` — la règle R2 gagne toujours. C'est ce qui
# protège `docs/adr/**`, `CLAUDE.md`, `VISION.md` et `ROADMAP.md`, tous
# listés en R2 : ils restent au niveau le plus élevé même si un motif
# ci-dessous semble les couvrir.
r0_allowlist = [
  "docs/*.md",
  "docs/operations/*.md",
  "docs/research/*.md",
]
r2_paths = [
  ".github/**",
  ".claude/**",
  ".gitleaks.toml",
  ".gitignore",
  ".cursorignore",
  "SECURITY.md",
  "control-plane/**",
  "hermes/**",
  "harness/**",
  "AGENTS.md",
  "CLAUDE.md",
  "VISION.md",
  "ROADMAP.md",
  "docs/adr/**",
  "data/**",
  "tools/map/sources.lock",
  "tools/map/data/**",
  "tools/map/artifacts/**",
  "tools/map/**/*provenance*",
  "tools/map/**/*manifest*",
  "tools/map/**/*dem*",
  "tools/map/**/*g6*",
  "tools/map/**/*relief*",
  "tools/map/**/*.tif",
  "tools/map/**/*.tiff",
  "tools/map/**/*.bin",
  "**/*.geojson",
  "**/*.parquet",
  "**/*.npy",
  "**/*.npz",
  "sim/tests/**",
]
generated_artifacts = [
  "**/artifacts/**",
  "**/build/**",
  "**/capture/**",
  "**/captures/**",
  "**/logs/**",
  "**/*.generated.*",
]

[risks.R0]
test_profile = "fast"

[risks.R0.timeouts]
planner = 60
executor = 300
reviewer = 60
proof = 600

[risks.R0.roles.planner]
backend = "none"

[risks.R0.roles.executor]
backend = "none"

[risks.R0.roles.reviewer]
backend = "none"

[risks.R1]
test_profile = "pr"

[risks.R1.timeouts]
planner = 900
executor = 3600
reviewer = 900
proof = 7200

[risks.R1.roles.planner]
backend = "cursor"
model = "cursor-grok-4.6"
effort = "high"

[risks.R1.roles.executor]
backend = "cursor"
model = "composer-2.5"
resume = true

[risks.R1.roles.reviewer]
backend = "cursor"
model = "cursor-grok-4.6"
effort = "xhigh"

[risks.R2]
test_profile = "certify"

[risks.R2.timeouts]
planner = 1200
executor = 7200
reviewer = 1200
proof = 21600

[risks.R2.roles.planner]
backend = "cursor"
model = "cursor-grok-4.6"
effort = "xhigh"

[risks.R2.roles.executor]
backend = "cursor"
model = "composer-2.5"
resume = true

[risks.R2.roles.reviewer]
backend = "cursor"
model = "cursor-grok-4.6"
effort = "xhigh"
