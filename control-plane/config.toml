[project]
id = "forgehistory-citylab"
engine_repository = "PLiagre/ForgeHistory"
city_repository = "PLiagre/VictoriaCityLab"
default_base_ref = "origin/master"
default_base_branch = "master"

[tools]
claude_binary = "claude"
cursor_binary = "agent"
claude_model = ""
cursor_model = "auto"
timeout_seconds = 1800

[roles.planner]
model = "claude-opus-5"
effort = "xhigh"

[roles.reviewer]
model = "claude-opus-5"
effort = "low"

[roles.executor]
model = "composer-2.5"
