# harness/pipeline/auto_policy.yaml
#
# Normative, versioned, tested policy that replaces the owner's manual
# accept/reject step described in ADR-0005, per the derogation recorded in
# ADR-0006 (docs/adr/0006-full-auto-agent-pipeline.md). Every rule below is
# deterministic -- no LLM decides here, only `audit_decision.py --policy
# auto` (Lot 006a) and, in Lot 006b, `orchestrator.py` read this file and
# apply it mechanically. Parsed by harness/pipeline/policy_loader.py (no
# PyYAML dependency -- see generator-log.md for why).
#
# `mode: full_auto` is the value this policy documents/activates; the LIVE
# switch lives in harness/pipeline/config.yaml (`mode:`), which stays
# `manual` until Lot 006c's demo has proven the loop end-to-end (see brief
# 006 "Lots atomiques" -- "Après 006c: activer mode: full_auto").
mode: full_auto

# One entry per row of brief 006 "## Politique auto" (10 rows -> 10 rules,
# each carrying event / condition / action so it stays machine-parseable).
rules:
  - id: audit_pr_merge_ci_green
    event: audit_pr_merge
    condition: ci_audit_guard_and_harness_ci_green
    action: auto_merge_already_done_by_bot_ledger_AUDIT_PROPOSED_optional

  - id: review_all_refuted
    event: review_recorded
    condition: all_points_refuted
    action: ledger_AUDIT_REJECTED_then_AUDIT_ARCHIVED_end_cycle

  - id: review_has_confirmed_or_partial
    event: review_recorded
    condition: at_least_one_confirmed_or_partial
    action: ledger_AUDIT_APPROVED_retained_points_confirmed_union_partial

  - id: review_needs_owner_only
    event: review_recorded
    condition: needs_owner_without_confirmed_or_partial
    action: ledger_AUDIT_REJECTED_reason_policy_no_owner_in_full_auto

  - id: approved_audit_convert
    event: audit_approved
    condition: always
    action: audit_convert_one_brief_per_retained_finding_if_split_needed_else_one_brief

  - id: brief_seed_created
    event: brief_seed_created
    condition: planificateur_auto
    action: claude_planificateur_fills_todo_same_pipeline_separate_invocation

  - id: gate_accept
    event: gate_accept
    condition: always
    action: launch_evaluateur_auto

  - id: evaluateur_pass
    event: evaluateur_pass
    condition: ci_green_post_merge
    action: ledger_AUDIT_IMPLEMENTED_then_AUDIT_VERIFIED_then_archive_source_audit

  - id: three_consecutive_mechanical_rejects
    event: gate_reject
    condition: three_consecutive_mechanical_rejects_same_brief
    action: open_bot_issue_pipeline_stuck_no_human_wait

  - id: budget_exhausted
    event: budget_exhausted
    condition: always
    action: write_checkpoint_then_enqueue_continuation_brief_no_blind_retry

# Interdit en full_auto (brief 006, repeated here so the policy file is
# self-contained for whoever reads only this file -- documentation only,
# not a parsed key, to keep policy_loader.py's tiny parser honest about
# what it actually reads):
#   - merge vers master si un workflow requis est rouge
#   - modifier auto_policy.yaml dans la meme PR qu'un audit Cursor
