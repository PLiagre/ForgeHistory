# harness/pipeline/config.yaml
#
# Live switches for the full-auto pipeline (ADR-0006,
# harness/pipeline/auto_policy.yaml). Parsed by
# harness/pipeline/policy_loader.py (`load_flat_yaml`) -- no PyYAML
# dependency in this repo, see generator-log.md.
#
# Emergency kill-switch: set `mode: manual` (below) to fall back to the
# ADR-0005 human loop (/forge-audit-accept, /forge-audit-reject), or apply
# the `pipeline/pause` label to a PR/issue that the workflows read. Full
# activation/deactivation steps: docs/rules/full-auto-pipeline.md
#
# `mode: full_auto_decision_only` activated after Lot 006c: the brief's
# "Lots atomiques" ordering gated this flip on 006c's end-to-end demo
# proving the loop closes without a human (idempotent demo, exit 0,
# IMPLEMENTED->VERIFIED->ARCHIVED) and the budget supervisor (006c) being in
# place to catch runaway cost. ADR-0007 (docs/adr/0007-full-auto-mode-split.md)
# split the single `full_auto` value into `full_auto_decision_only` (audit ->
# owner decision today; the challenge maillon is wired by brief 009 Lot
# 009c, not yet as of Lot 009a -- pipeline-challenge.yml's invocation step
# is still the documented TODO(operator...) stub until 009c lands) and a
# reserved, fail-closed `full_auto` (refused by
# harness/pipeline/full_auto_mode_guard.py until forge-run's own invocation
# is wired for real -- see that module's docstring). To deactivate, revert
# this to `manual` -- the ADR-0005 human loop is unchanged.
mode: full_auto_decision_only

# Ceiling on how many times the orchestrator (Lot 006b) may re-invoke
# claude-developer on the SAME brief after a REJECT/plateau before it must
# escalate instead of retrying (see auto_policy.yaml rule
# three_consecutive_mechanical_rejects).
max_forge_run_iterations: 3

auto_merge_audit_prs: true
auto_merge_review_prs: true
claude_challenge_on_inbox_merge: true
cursor_audit_on_master_push: true

# Auto-merge is restricted to these path prefixes (bot branches only:
# cursor/*, forge-bot/*). Any PR touching a path outside this list is never
# auto-merged, full_auto or not.
auto_merge_allowlist:
  - architecture/inbox/**
  - architecture/reviews/**
  - harness/queue/briefs/**/feedback/**

# Non-Goals (brief 006) made literal and enforced here, not just prose:
# these paths are NEVER auto-merged without an explicit owner-listed
# exception recorded in ADR-0006. Restated (not paraphrased as an
# instruction) from ADR-0006's Risks/Mitigations section.
auto_merge_denylist:
  - .github/workflows/**
  - harness/verdict_audit.py
  - VISION.md
