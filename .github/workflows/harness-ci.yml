name: harness-ci

# Checks PR vitaux (ADR-0018) :
#   * harness-tests -- suite harnais (les tests Unity/PowerShell SKIP sur Linux)
#   * sim-tests -- moteur vivant
#   * f0-demo -- la porte mécanique refuse encore un faux brief
#   * risk-gate -- HORS CHEMIN : succès explicite, plus de déclaration
#     Forge-Risk exigée sur le corps de PR
#
# Why the honest-brief control is NOT run here: its ACCEPT depends on file
# mtime invariants (rubric predates deliverables) that a git checkout
# destroys -- checkout stamps every file with the same clock time. That
# check is meaningful only in its authoring context; the ACCEPT path is
# instead covered robustly by test_verdict_audit.py's fixtures.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run the harness test suite
        run: python -m pytest harness/tests/ -v

  sim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run the sim test suite
        run: python -m pytest sim/tests/ -v

  f0-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: The fake brief must be rejected by the mechanical gate
        run: python harness/demo/fake_brief_001/run_demo.py

  risk-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Porte de risque hors chemin PR (ADR-0018)
        run: |
          echo "ADR-0018 : risk-gate n'est plus un check de PR."
          echo "Le classement R0/R1/R2 reste dans control-plane/workflow-policy.toml."
          echo "Ce job reste nommé pour une protection de branche déjà déclarée ;"
          echo "il ne prétend plus comparer un corps de PR à une politique."
