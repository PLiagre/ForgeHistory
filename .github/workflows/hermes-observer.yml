name: hermes-observer-retired

# ADR-0013 retire l'observateur Windows qui réveillait le PC du propriétaire
# pour chaque événement. Le fichier reste déclenchable manuellement pendant le
# pilote afin que le retrait soit visible et réversible dans l'historique.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Observateur Hermes local suspendu par ADR-0013 ; utiliser control-plane/."
