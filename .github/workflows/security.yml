name: security

# Migration step 10: supply-chain and secret hygiene. Scoped to what is
# robust and actually valuable for THIS repo:
#   * actionlint -- static analysis of the workflows themselves (official
#                   binary, no third-party action).
#   * gitleaks   -- scan the working tree for committed secrets (official
#                   binary, pinned version; `dir` = filesystem scan).
#
# Deliberately omitted, honestly: dependency-review has nothing to review
# (no versioned dependency manifests in this repo). All actions are pinned
# to a full commit SHA, per the audit's supply-chain recommendation.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download actionlint
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash -o download-actionlint.bash
          bash download-actionlint.bash
      - name: Lint all workflows
        run: ./actionlint -color

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the working tree for secrets
        run: ./gitleaks dir . --redact -v
