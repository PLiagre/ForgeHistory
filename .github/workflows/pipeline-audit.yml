name: pipeline-audit

# ADR-0012 (2026-08-13, décision propriétaire) : l'audit Cursor ne se
# déclenche PLUS ni à chaque pull request ni à chaque push sur master --
# cette cadence-là a consommé le plafond mensuel Claude deux fois en
# vingt-quatre heures via les contre-audits qu'elle entraînait (mesures
# dans hermes/requests/DEMANDE-20260813-audit-par-grandes-etapes.md).
# Deux déclencheurs restants :
#   * push master touchant hermes/milestones/*.md -- la clôture d'une
#     GRANDE ÉTAPE du projet (jalon, voir ROADMAP.md § « Grandes étapes —
#     jalons d'audit » et hermes/milestones/README.md). L'auditeur relit
#     l'étape entière, pas un commit isolé.
#   * workflow_dispatch -- audit ponctuel jugé crucial par un humain
#     (incident, changement structurel entériné par ADR, doute).
# L'agent reste un Cursor Cloud Agent lancé par l'API officielle
# (POST https://api.cursor.com/v1/agents, authentification Basic avec la
# clé en nom d'utilisateur), rôle architecture/agents/cursor-auditor.md,
# compagnon cursor-qa-scout. Son livrable reste un audit sous
# architecture/inbox/** déposé par une PR cursor/*.
#
# Sans CURSOR_API_KEY : dérogation consignée en ::warning::, aucun appel
# simulé, le job réussit sans rien prétendre. Le label `pipeline/pause`
# ouvert n'importe où coupe l'invocation (docs/rules/full-auto-pipeline.md).

on:
  push:
    branches: [master]
    paths:
      - 'hermes/milestones/*.md'
  workflow_dispatch:
    inputs:
      target_commit:
        description: "SHA to audit (defaults to the triggering push's SHA)"
        required: false
      raison:
        description: "pourquoi cet audit ponctuel (incident, ADR, doute) -- recopié dans le prompt"
        required: false

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  invoke-cursor-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Kill-switch -- any open pipeline/pause label stops everything
        id: pause
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          paused="$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=pipeline/pause&state=open" --jq 'length')"
          if [ "$paused" -gt 0 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pipeline/pause label found on $paused open issue(s)/PR(s) -- no agent invocation, documented waiver (docs/rules/full-auto-pipeline.md)."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Cursor Cloud Agent credentials
        id: check
        if: steps.pause.outputs.paused != 'true'
        env:
          HAS_CURSOR: ${{ secrets.CURSOR_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CURSOR" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CURSOR_API_KEY not configured -- documented waiver, no invocation attempted. Open a Cursor Cloud Agent session manually with architecture/agents/cursor-auditor.md as the role template (ADR-0010/0012, docs/rules/full-auto-pipeline.md)."
          fi

      # Le périmètre de l'audit d'étape : tout ce qui est entré sur master
      # depuis le jalon précédent. Le jalon précédent est le dernier commit
      # (avant celui-ci) qui a touché hermes/milestones/*.md ; pour le
      # premier jalon, l'origine du dépôt.
      - name: Resolve stage boundaries (previous milestone -> this one)
        id: stage
        if: steps.check.outputs.available == 'true'
        env:
          TARGET_COMMIT: ${{ github.event.inputs.target_commit || github.sha }}
        run: |
          set -euo pipefail
          jalons="$(git log --format='%H' -- hermes/milestones/*.md 2>/dev/null || true)"
          courant="$(printf '%s\n' "$jalons" | head -1 || true)"
          precedent="$(printf '%s\n' "$jalons" | sed -n '2p' || true)"
          echo "previous=${precedent:-<origine du dépôt>}" >> "$GITHUB_OUTPUT"
          echo "Jalon courant: ${courant:-aucun} | jalon précédent: ${precedent:-aucun (origine)}"

      # Modèle : le propriétaire exige au moins Opus pour la critique
      # (2026-08-12). Le workflow ne devine pas : il interroge GET
      # /v1/models, honore la variable de dépôt CURSOR_AUDITOR_MODEL si
      # elle correspond à un identifiant réel, sinon prend le premier
      # modèle « opus » (puis « grok »), et journalise la liste complète.
      - name: Invoke cursor-auditor (Cloud Agents API v1)
        if: steps.check.outputs.available == 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          CURSOR_AUDITOR_MODEL: ${{ vars.CURSOR_AUDITOR_MODEL || '' }}
          EVENT_NAME: ${{ github.event_name }}
          TARGET_COMMIT: ${{ github.event.inputs.target_commit || github.sha }}
          RAISON: ${{ github.event.inputs.raison || '' }}
          PREVIOUS_MILESTONE: ${{ steps.stage.outputs.previous }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          auth_header="Authorization: Basic $(printf '%s:' "$CURSOR_API_KEY" | base64 -w0)"

          ids="$(curl -sS --fail-with-body --url https://api.cursor.com/v1/models --header "$auth_header" \
            | jq -r '[.items[] | .id, (.aliases[]? // empty)] | .[]' || true)"
          echo "Modèles disponibles (GET /v1/models):"
          printf '%s\n' "$ids"
          model=""
          if [ -n "${CURSOR_AUDITOR_MODEL:-}" ]; then
            if printf '%s\n' "$ids" | grep -qxF "$CURSOR_AUDITOR_MODEL"; then
              model="$CURSOR_AUDITOR_MODEL"
            else
              echo "::warning::CURSOR_AUDITOR_MODEL='$CURSOR_AUDITOR_MODEL' inconnu de l'API -- repli sur la préférence opus/grok (liste réelle ci-dessus)."
            fi
          fi
          if [ -z "$model" ]; then
            model="$(printf '%s\n' "$ids" | grep -i opus | grep -i thinking | head -1 || true)"
          fi
          if [ -z "$model" ]; then
            model="$(printf '%s\n' "$ids" | grep -i opus | head -1 || true)"
          fi
          if [ -z "$model" ]; then
            model="$(printf '%s\n' "$ids" | grep -i grok | head -1 || true)"
          fi
          if [ -z "$model" ]; then
            echo "::warning::aucun modèle opus/grok trouvé dans la liste -- le défaut du compte sera utilisé."
          fi
          echo "Modèle retenu: ${model:-<défaut du compte>}"

          consignes="Livrable: UN SEUL audit architecture/inbox/CURSOR-<sha>-<slug>.md déposé par une PR cursor/* \
          qui ne touche que architecture/inbox/**. Pousse UNE seule branche cursor/* (jamais de branches \
          de brouillon multiples) et OUVRE toi-même la pull request avant de terminer -- une branche \
          poussée sans PR est un livrable incomplet. Respecte chaque section Interdits du contrat."
          if [ "$EVENT_NAME" = "push" ]; then
            prompt="Tu es cursor-auditor (contrat: architecture/agents/cursor-auditor.md), \
          avec cursor-qa-scout (architecture/agents/cursor-qa-scout.md) en compagnon de session. \
          AUDIT DE GRANDE ÉTAPE (ADR-0012): un jalon vient d'être fusionné sur master au commit ${TARGET_COMMIT} \
          (fichier hermes/milestones/, lis-le d'abord — il dit ce que l'étape devait réunir). \
          Audite l'ÉTAPE ENTIÈRE: tout ce qui est entré sur master depuis le jalon précédent \
          (${PREVIOUS_MILESTONE}), pas un commit isolé. Risques P0-P3, sources externes datées, \
          au plus 3 briefs proposés — privilégie les constats de fond sur les redites de forme. ${consignes}"
          else
            prompt="Tu es cursor-auditor (contrat: architecture/agents/cursor-auditor.md), \
          avec cursor-qa-scout (architecture/agents/cursor-qa-scout.md) en compagnon de session. \
          AUDIT PONCTUEL demandé par un humain (workflow_dispatch, ADR-0012). Raison déclarée: ${RAISON:-non renseignée}. \
          Audite le commit ${TARGET_COMMIT}: diff, état du dépôt, risques P0-P3, sources externes datées, \
          au plus 3 briefs proposés. ${consignes}"
          fi
          payload="$(jq -n \
            --arg prompt "$prompt" \
            --arg model "$model" \
            --arg repo "$REPO_URL" \
            --arg ref "$TARGET_COMMIT" \
            '{prompt: {text: $prompt}, repos: [{url: $repo, startingRef: $ref}], autoCreatePR: true}
             | if $model != "" then . + {model: {id: $model}} else . end')"
          # (auth_header défini en tête de step -- Basic, clé en nom
          # d'utilisateur, mot de passe vide, en en-tête pour ne pas
          # déclencher le faux positif gitleaks `curl-auth-user`.)
          response="$(curl -sS --fail-with-body \
            --request POST \
            --url https://api.cursor.com/v1/agents \
            --header "$auth_header" \
            --header 'Content-Type: application/json' \
            --data "$payload")" || {
              echo "::error::Cursor Cloud Agents API call failed:"
              printf '%s\n' "$response"
              exit 1
            }
          printf '%s\n' "$response" | jq '{agent_id: (.agent.id // .id), status: (.run.status // .status)}'
          echo "cursor-auditor launched -- its audit will arrive as a cursor/* PR touching architecture/inbox/** only."
