name: pipeline-challenge

# ADR-0010 : le contre-audit réel. Claude (claude-challenger,
# architecture/agents/claude-challenger.md) est invoqué headless via
# /forge-audit-review chaque fois qu'un merge/push ajoute ou modifie un
# audit sous architecture/inbox/. La revue produite est publiée en PR sur
# une branche forge-bot/* (architecture/reviews/** est allowlisté par le
# merge-bot), ce qui déclenche ensuite pipeline-orchestrate.yml.
#
# Garde-fous, dans l'ordre où ils coupent : label `pipeline/pause` ouvert,
# consultation runtime du `mode:` de harness/pipeline/config.yaml (manual =
# pas d'invocation -- brief 009 lot 009c SC15), plafond mensuel
# ci_budget_guard precheck (lot 009b), plafond natif --max-budget-usd 5 sur
# l'appel lui-même (arbitrage n°2 du 2026-08-11), marquage post-hoc.
# Sans identifiant Claude (CLAUDE_CODE_OAUTH_TOKEN d'abonnement, ou
# ANTHROPIC_API_KEY en repli) : dérogation consignée, aucun appel simulé.
#
# Le job mechanical-scaffold-smoke est conservé tel quel : il prouve à
# chaque déclenchement, sans secret, que la moitié NON-LLM du rôle
# (scaffold -> record -> ledger AUDIT_CHALLENGED) fonctionne réellement.

on:
  push:
    branches: [master]
    paths:
      - 'architecture/inbox/*.md'
  workflow_dispatch:
    inputs:
      audit_id:
        description: "audit_id to challenge (e.g. CURSOR-<sha>-<slug>)"
        required: false

permissions:
  contents: write
  issues: read
  pull-requests: write

jobs:
  invoke-claude-challenger:
    runs-on: ubuntu-latest
    steps:
      # Le jeton FORGE_BOT_PAT (PAT fine-grained du propriétaire, secret
      # optionnel) sert au push de la branche ET au `gh pr create` plus bas :
      # une PR ouverte avec GITHUB_TOKEN ne déclenche pas les workflows
      # `pull_request` (ils restent en attente d'approbation manuelle
      # « Approve and run »). Avec le PAT, la PR est portée par le
      # propriétaire et la CI se lance seule. Repli : GITHUB_TOKEN, même
      # comportement dégradé qu'avant (PR à approuver à la main).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGE_BOT_PAT || github.token }}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Kill-switch -- any open pipeline/pause label stops everything
        id: pause
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          paused="$(gh api "repos/${GITHUB_REPOSITORY}/issues?labels=pipeline/pause&state=open" --jq 'length')"
          if [ "$paused" -gt 0 ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pipeline/pause label found on $paused open issue(s)/PR(s) -- no agent invocation, documented waiver (docs/rules/full-auto-pipeline.md)."
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Runtime mode check (brief 009 lot 009c SC15) -- manual means no invocation
        id: mode
        if: steps.pause.outputs.paused != 'true'
        run: |
          set -euo pipefail
          mode="$(python - <<'PY'
          import sys
          sys.path.insert(0, "harness/pipeline")
          import policy_loader
          print(policy_loader.load_flat_yaml("harness/pipeline/config.yaml").get("mode", ""))
          PY
          )"
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          if [ "$mode" = "manual" ]; then
            echo "::warning::harness/pipeline/config.yaml declares mode: manual -- no headless invocation; run /forge-audit-review interactively instead (docs/rules/full-auto-pipeline.md)."
          fi

      - name: Resolve audit_id -- explicit input, or the push's own unambiguous diff
        id: resolve
        if: steps.pause.outputs.paused != 'true' && steps.mode.outputs.mode != 'manual'
        env:
          IN_AUDIT_ID: ${{ github.event.inputs.audit_id }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ -n "${IN_AUDIT_ID:-}" ]; then
            echo "audit_id=${IN_AUDIT_ID}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER" -- 'architecture/inbox/*.md' || true)"
          count="$(printf '%s\n' "$changed" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "audit_id=" >> "$GITHUB_OUTPUT"
            echo "::warning::push diff names $count changed inbox file(s) -- ambiguous, no guess: trigger workflow_dispatch with an explicit audit_id instead."
            exit 0
          fi
          audit_id="$(basename "$changed" .md)"
          echo "audit_id=${audit_id}" >> "$GITHUB_OUTPUT"

      - name: Monthly CI budget precheck (lot 009b)
        if: steps.resolve.outputs.audit_id != ''
        run: |
          set -euo pipefail
          python harness/pipeline/ci_budget_guard.py precheck

      # Abonnement d'abord (décision propriétaire du 2026-08-12) :
      # CLAUDE_CODE_OAUTH_TOKEN (jeton `claude setup-token`, plans Pro/Max)
      # consomme le quota de l'abonnement ; ANTHROPIC_API_KEY reste le repli
      # en facturation API.
      - name: Check headless credential availability
        id: check
        if: steps.resolve.outputs.audit_id != ''
        env:
          HAS_CLAUDE_SUB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_CLAUDE_SUB" = "true" ] || [ "$HAS_ANTHROPIC" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Claude auth: $([ "$HAS_CLAUDE_SUB" = "true" ] && echo 'abonnement (CLAUDE_CODE_OAUTH_TOKEN)' || echo 'clé API (ANTHROPIC_API_KEY)')"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Neither CLAUDE_CODE_OAUTH_TOKEN (abonnement) nor ANTHROPIC_API_KEY is configured -- documented waiver, no invocation attempted. Run /forge-audit-review ${{ steps.resolve.outputs.audit_id }} manually, or provision a secret (docs/rules/full-auto-pipeline.md, ADR-0010)."
          fi

      - name: Install Claude Code CLI
        if: steps.check.outputs.available == 'true'
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Export transcript path (N4 -- chemin unique réutilisé par toutes les étapes)
        id: transcript_path
        if: steps.check.outputs.available == 'true'
        run: echo "path=$RUNNER_TEMP/challenge-transcript.jsonl" >> "$GITHUB_OUTPUT"

      - name: Invoke claude-challenger headless (/forge-audit-review)
        id: invoke
        if: steps.check.outputs.available == 'true'
        # B1 : continue-on-error permet aux étapes de classification et de repli
        # de s'exécuter même quand le CLI retourne un code non nul (cas 429).
        # Le job reste rouge au total via l'étape de repli (exit 1 quand pas de
        # revue produite) -- jamais via cette étape seule.
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUDIT_ID: ${{ steps.resolve.outputs.audit_id }}
        run: |
          set -euo pipefail
          claude -p "/forge-audit-review ${AUDIT_ID}" \
            --permission-mode acceptEdits \
            --max-turns 100 \
            --max-budget-usd 5.00 \
            --output-format stream-json --verbose \
            | tee "${{ steps.transcript_path.outputs.path }}"

      - name: Post-hoc budget marking (lot 009b, arbitrage n°2)
        # B5 (brief 014, it. 3) : condition d'origine restaurée — la protection
        # interne (|| echo "::warning::...") suffit pour les transcripts illisibles.
        if: steps.check.outputs.available == 'true'
        env:
          AUDIT_ID: ${{ steps.resolve.outputs.audit_id }}
        run: |
          set -euo pipefail
          python harness/pipeline/ci_budget_guard.py record \
            --step-name "challenge:${AUDIT_ID}" \
            --transcript "${{ steps.transcript_path.outputs.path }}" \
            --per-invocation-cap-usd 5 \
            || echo "::warning::post-hoc cost marking refused (unreadable transcript format) -- native --max-budget-usd already capped the spend; recording skipped rather than guessed."

      - name: Classify vendor refusal (brief 014)
        id: classify_refusal
        # B1 : pas de fonction de statut explicite ici -- la condition par défaut
        # success() est vraie car continue-on-error masque l'échec de l'invocation.
        if: steps.check.outputs.available == 'true'
        env:
          AUDIT_ID: ${{ steps.resolve.outputs.audit_id }}
          TRANSCRIPT_PATH: ${{ steps.transcript_path.outputs.path }}
        run: |
          set -euo pipefail
          classification="$(python - <<'PY'
          import sys, os
          sys.path.insert(0, "harness/pipeline")
          import vendor_refusal
          result = vendor_refusal.classify(os.environ["TRANSCRIPT_PATH"])
          print(result)
          PY
          )"
          echo "classification=${classification}" >> "$GITHUB_OUTPUT"
          echo "Transcript classification: ${classification}"
          if [ "$classification" = "vendor_refusal" ]; then
            python - <<'PY'
          import sys, os
          sys.path.insert(0, "harness/pipeline")
          import vendor_refusal
          vendor_refusal.log_refusal(
              os.environ["AUDIT_ID"],
              os.environ["TRANSCRIPT_PATH"],
              "harness/pipeline/vendor-refusal-state.jsonl",
          )
          print("Refus fournisseur consigné dans vendor-refusal-state.jsonl")
          PY
          fi

      - name: Repli Codex si refus fournisseur (brief 014)
        id: codex_fallback
        if: steps.check.outputs.available == 'true' && steps.classify_refusal.outputs.classification == 'vendor_refusal'
        env:
          AUDIT_ID: ${{ steps.resolve.outputs.audit_id }}
          HAS_CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON != '' }}
          HAS_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TRANSCRIPT_PATH: ${{ steps.transcript_path.outputs.path }}
        run: |
          set -euo pipefail
          if [ "$HAS_CODEX_AUTH" != "true" ] && [ "$HAS_OPENAI_KEY" != "true" ]; then
            echo "::warning::Repli Codex indisponible — identifiants absents"
            echo "::warning::Repli Codex échoué (ou absent) pour AUDIT_ID ${AUDIT_ID} — contre-audit non produit. État du refus consigné dans vendor-refusal-state.jsonl."
            exit 1
          fi
          # Vérification budget avant appel Codex
          python harness/pipeline/ci_budget_guard.py precheck || {
            echo "::warning::Repli Codex bloqué par ci_budget_guard precheck."
            exit 1
          }
          # Tentative repli Codex (même commande /forge-audit-review, sans --max-budget-usd)
          if codex exec "/forge-audit-review ${AUDIT_ID}" 2>&1; then
            # N2 : le succès n'est déclaré qu'APRÈS insertion effective du marqueur.
            # Si aucun fichier de revue n'est trouvé, on émet un ::warning:: et
            # on échoue plutôt que de publier une revue non marquée comme Codex.
            python - <<'PY'
          import sys, os, glob
          sys.path.insert(0, "harness/pipeline")
          import vendor_refusal
          audit_id = os.environ["AUDIT_ID"]
          # Motif élargi pour couvrir les noms produits par Codex
          reviews = glob.glob(f"architecture/reviews/CLAUDE-{audit_id}*.md") + \
                    glob.glob(f"architecture/reviews/{audit_id}*.md")
          if not reviews:
              print(f"::warning::Codex exec a réussi mais aucun fichier de revue trouvé pour {audit_id} — marqueur non inséré.")
              sys.exit(1)
          for r in reviews:
              vendor_refusal.mark_fallback_actor(r)
              print(f"Marqueur forge-challenger-codex inséré dans {r}")
          vendor_refusal.mark_fallback_attempted(audit_id, "harness/pipeline/vendor-refusal-state.jsonl")
          print("fallback_attempted mis à True dans vendor-refusal-state.jsonl")
          PY
            echo "codex_success=true" >> "$GITHUB_OUTPUT"
            echo "Repli Codex réussi pour ${AUDIT_ID}"
          else
            echo "::warning::Repli Codex échoué (ou absent) pour AUDIT_ID ${AUDIT_ID} — contre-audit non produit. État du refus consigné dans vendor-refusal-state.jsonl."
            exit 1
          fi

      - name: Commit état du refus fournisseur (N3/N5/N6 -- après repli)
        # N3 : vendor-refusal-state.jsonl est commis sur une branche dédiée même
        # quand le repli Codex échoue. La branche reste consultable depuis un clone.
        # N5 : l'étape est placée APRÈS le repli pour que mark_fallback_attempted
        # (appelé dans l'étape de repli) ait déjà mis le champ à True dans l'arbre
        # de travail avant ce commit.
        # N6 : vérification avant git checkout -b pour pouvoir sortir sur la
        # branche d'origine si rien à commiter.
        # !cancelled() : on entre même quand le repli a échoué (job_ok=false).
        if: steps.classify_refusal.outputs.classification == 'vendor_refusal' && !cancelled()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.FORGE_BOT_PAT || secrets.GITHUB_TOKEN }}
          AUDIT_ID: ${{ steps.resolve.outputs.audit_id }}
        run: |
          set -euo pipefail
          # N6 : contrôle AVANT de créer la branche — sortie propre si rien à commiter
          if git diff --quiet HEAD -- harness/pipeline/vendor-refusal-state.jsonl; then
            echo "Aucune modification à commiter — on reste sur la branche d'origine."
            exit 0
          fi
          branch="forge-bot/vendor-refusal-${AUDIT_ID}-${GITHUB_RUN_ID}"
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add harness/pipeline/vendor-refusal-state.jsonl
          git commit -m "state: refus fournisseur consigné pour ${AUDIT_ID} (run ${GITHUB_RUN_ID})"
          git push -u origin "$branch" \
            || echo "::warning::push de la branche d'état du refus fournisseur échoué — ligne visible dans le log du run."
          git checkout -

      - name: Publish the review as a pull request (reviews/** is merge-bot allowlisted)
        # B2 : condition d'origine restaurée -- l'étape entre dès que les
        # identifiants sont disponibles, quelle que soit la classification du
        # transcript. Si aucune revue n'est dans architecture/reviews/, le garde
        # interne (git status --porcelain) émet ::warning:: et quitte proprement.
        # Aucun chemin ne peut finir vert avec une revue produite non publiée.
        if: steps.check.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.FORGE_BOT_PAT || secrets.GITHUB_TOKEN }}
          AUDIT_ID: ${{ steps.resolve.outputs.audit_id }}
        run: |
          set -euo pipefail
          # La ligne AUDIT_CHALLENGED écrite localement par le gate `record`
          # pendant l'invocation ne part PAS dans la PR : deux challenges
          # ouverts en même temps entreraient en conflit d'append sur le
          # ledger partagé (et audit-ledger.jsonl n'a jamais été dans
          # l'allowlist du merge-bot). La ligne authentique est ré-écrite
          # sur master, après fusion, par pipeline-orchestrate.yml
          # (orchestrator.py -> audit_review.record_challenge, mêmes gardes).
          git checkout -- architecture/audit-ledger.jsonl || true
          if [ -z "$(git status --porcelain -- architecture/reviews)" ]; then
            echo "::warning::the invocation left no review -- nothing to publish; inspect the transcript in this run's log."
            exit 0
          fi
          branch="forge-bot/review-${AUDIT_ID}-${GITHUB_RUN_ID}"
          git config user.name "forge-bot"
          git config user.email "forge-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add architecture/reviews
          git add harness/pipeline/vendor-refusal-state.jsonl
          git commit -m "challenge: revue CLAUDE-${AUDIT_ID} (claude-challenger headless, run ${GITHUB_RUN_ID})"
          git push -u origin "$branch"
          gh pr create \
            --head "$branch" \
            --title "challenge: revue de l'audit ${AUDIT_ID}" \
            --body "$(printf 'Contre-audit produit headless par claude-challenger (run %s).\n\nLa fusion de cette PR déclenche pipeline-orchestrate.yml (event review_recorded).' "$GITHUB_RUN_ID")" \
            || echo "::warning::gh pr create refused (repository setting or permissions) -- branch $branch is pushed; open the PR manually."

      - name: Relever l'échec d'invocation non-429 (B3 -- brief 014)
        # B3 : si l'invocation a échoué (outcome=failure) et que la classification
        # n'est pas vendor_refusal, aucun repli n'a relevé l'échec. Le job doit
        # rester rouge — un run vert sans revue produite serait silencieux et
        # n'activerait pas pipeline-failure-escalate.yml (qui ne se déclenche que
        # sur conclusion='failure'). La condition sans fonction de statut ajoute
        # implicitement success() : l'étape n'est atteinte que si publish a réussi
        # (ce qu'elle fait, même sans revue, via son exit 0 interne).
        if: steps.invoke.outcome == 'failure' && steps.classify_refusal.outputs.classification != 'vendor_refusal'
        run: |
          echo "::warning::L'invocation Claude a échoué (classification : ${{ steps.classify_refusal.outputs.classification }}) sans repli disponible — le job reste rouge pour déclencher l'escalade."
          exit 1

  mechanical-scaffold-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Mock a filled review and prove scaffold -> record -> ledger works
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/inbox"
          cat > "$tmp/inbox/CURSOR-ciSmoke-topic.md" <<'EOF'
          ---
          audit_id: CURSOR-ciSmoke-topic
          auditor: cursor-cloud
          target_branch: master
          target_commit: 623118671dd98543a197b06415a240b9912999af
          created_at: 2026-08-05T10:00:00Z
          status: PROPOSED
          ---
          # corps
          EOF
          python harness/audit_review.py scaffold --audit-id CURSOR-ciSmoke-topic \
            --inbox "$tmp/inbox" --reviews "$tmp/reviews"
          python - "$tmp/reviews/CLAUDE-CURSOR-ciSmoke-topic.md" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          text = re.sub(r"<<[^>]*>>", "ci smoke mock", text)
          text += "\n| 1 | mock point | CONFIRMED | ci smoke, no placeholder left |\n"
          open(path, "w", encoding="utf-8").write(text)
          PY
          python harness/audit_review.py record --audit-id CURSOR-ciSmoke-topic \
            --inbox "$tmp/inbox" --reviews "$tmp/reviews" --ledger "$tmp/ledger.jsonl"
          python harness/audit_ledger.py show --ledger "$tmp/ledger.jsonl" --audit-id CURSOR-ciSmoke-topic | grep -q AUDIT_CHALLENGED
          echo "STEP OK: mechanical-scaffold-smoke recorded AUDIT_CHALLENGED without an LLM"
