name: worker-pc

# Diagnostic manuel borné sur un runner Windows auto-hébergé.
# Un ping vert prouve seulement que le PC a répondu.

on:
  workflow_dispatch:
    inputs:
      tache:
        description: Tâche bornée (slice 1 = ping)
        required: true
        type: choice
        options:
          - ping
        default: ping

permissions:
  contents: read
  actions: write

concurrency:
  group: worker-pc
  cancel-in-progress: false

jobs:
  ping:
    runs-on: [self-hosted, windows]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ping du worker
        shell: powershell
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force ping-out | Out-Null
          $ram = [int64](Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory
          $caps = New-Object System.Collections.Generic.List[string]
          [void]$caps.Add('windows')
          if ($ram -ge 24GB) { [void]$caps.Add('high-memory') }
          $payload = [ordered]@{
            schema_version = 1
            hostname = [System.Net.Dns]::GetHostName()
            sha = $env:GITHUB_SHA
            capabilities = $caps
          }
          $json = $payload | ConvertTo-Json -Compress
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'ping-out/ping.json'), $json, $utf8)
          Get-Content -Raw ping-out/ping.json
      - name: Publier l'artefact ping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-ping
          path: ping-out/ping.json
          if-no-files-found: error
