name: pipeline-orchestrate

# Brief 006, Lot 006b, Success Condition 11. Runs
# harness/pipeline/orchestrator.py: auto-approve/reject a challenged audit,
# convert an approved one, or record an evaluateur_pass -- always by
# dispatching to the one existing module that owns the transition (see
# orchestrator.py's own docstring). No LLM decides in this workflow.
#
# Two ways in:
#   * workflow_dispatch -- the reliable path. Explicit --event and either
#     --audit-id or a full --payload. Always available, needs no guessing.
#   * push to master touching architecture/reviews/*.md -- best-effort
#     auto-dispatch. Only fires when the push's own before/after diff
#     names EXACTLY one changed review file (unambiguous audit_id); any
#     other shape (0 or >1 files) is left to a manual workflow_dispatch
#     rather than guessed.
#
# Safety net before committing: the ledger/decision/brief-seed write this
# job produces is diffed against a hard allowlist before `git push` --
# if the diff touches anything outside architecture/audit-ledger.jsonl,
# architecture/decisions/**, or harness/queue/briefs/**, the job fails
# instead of pushing (brief 006 Non-Goals: never auto-merge a change
# touching .github/workflows/**, harness/verdict_audit.py, or VISION.md).

on:
  push:
    branches: [master]
    paths:
      - 'architecture/reviews/*.md'
  workflow_dispatch:
    inputs:
      event:
        description: "orchestrator event kind"
        required: true
        default: review_recorded
      audit_id:
        description: "audit_id (used when --payload is not given)"
        required: false
      payload:
        description: "full JSON payload (overrides audit_id if given)"
        required: false

permissions:
  contents: write

# Un seul run à la fois, jamais annulé : trois challenges fusionnés coup
# sur coup (runs 31603872434/31603893491/31603909788, 2026-08-12) ont
# lancé trois orchestrations concurrentes -- la deuxième a perdu son push
# (`! [rejected] master -> master (fetch first)`) et sa ligne de ledger
# avec. Les écritures du ledger doivent rester sérialisées.
concurrency:
  group: pipeline-orchestrate-master
  cancel-in-progress: false

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    steps:
      # FORGE_BOT_PAT pour le push final : depuis la protection de branche
      # sur master, un push direct du jeton interne est rejeté (GH006,
      # run 31609187517 du 2026-08-12). Le PAT du propriétaire (admin)
      # passe la protection tant que « Do not allow bypassing » reste
      # décoché. Repli : GITHUB_TOKEN (échouera au push si master est
      # protégé -- visible, jamais silencieux).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.FORGE_BOT_PAT || github.token }}
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Resolve event + payload
        # Brief 008, Lot 008a: this step used to decide event=/payload=
        # itself, in inline bash, and never consulted
        # architecture/audit-ledger.jsonl before doing so -- the exact gap
        # that let incident run 31085883052 try to replay a transition on
        # an already-AUDIT_ARCHIVED audit. ALL decision logic (including
        # the push-diff auto-dispatch path's own SC2 ledger consultation
        # and SC5 ambiguous-diff fallback) now lives in
        # harness/pipeline/trigger_resolve.py -- unit-testable directly by
        # `py -m pytest harness/tests/test_trigger_resolve.py`, no GitHub
        # Actions context required. This step's own bash does only what
        # cannot move out of a real checkout: computing the push's own
        # before/after diff, then handing the raw filenames to that entry
        # point on stdin.
        id: resolve
        env:
          IN_EVENT: ${{ github.event.inputs.event }}
          IN_AUDIT_ID: ${{ github.event.inputs.audit_id }}
          IN_PAYLOAD: ${{ github.event.inputs.payload }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${{ github.event.before }}" "${{ github.event.after }}" -- 'architecture/reviews/*.md' || true)"
          printf '%s\n' "$changed" | python harness/pipeline/trigger_resolve.py resolve \
            --in-event "${IN_EVENT:-}" \
            --in-audit-id "${IN_AUDIT_ID:-}" \
            --in-payload "${IN_PAYLOAD:-}" \
            --ledger architecture/audit-ledger.jsonl \
            --github-output "$GITHUB_OUTPUT"

      - name: Run orchestrator
        if: steps.resolve.outputs.event != ''
        run: |
          set -euo pipefail
          python harness/pipeline/orchestrator.py run \
            --event "${{ steps.resolve.outputs.event }}" \
            --payload '${{ steps.resolve.outputs.payload }}'

      - name: Refuse to push outside the ledger/decision/brief allowlist
        if: steps.resolve.outputs.event != ''
        run: |
          set -euo pipefail
          changed="$(git diff --name-only || true)"
          offending="$(printf '%s\n' "$changed" | grep -vE '^(architecture/audit-ledger\.jsonl|architecture/decisions/|harness/queue/briefs/)' || true)"
          if [ -n "$offending" ]; then
            echo "::error::orchestrator produced changes outside the allowlist -- refusing to commit:"
            printf '%s\n' "$offending"
            exit 1
          fi

      - name: Commit ledger/decision/brief-seed update
        if: steps.resolve.outputs.event != ''
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
          else
            git config user.name "forge-bot"
            git config user.email "forge-bot@users.noreply.github.com"
            git add architecture/audit-ledger.jsonl architecture/decisions harness/queue/briefs
            git commit -m "pipeline-orchestrate: ${{ steps.resolve.outputs.event }}"
            # master peut avoir avancé pendant le run (fusion merge-bot,
            # tableau de bord Hermes) : rebase avant push. Les seuls autres
            # écrivains du ledger sont les runs de CE workflow (sérialisés
            # par le groupe concurrency ci-dessus), donc le rebase ne peut
            # pas conflicter sur le ledger -- même schéma que
            # hermes-dashboard.yml.
            git pull --rebase origin master
            git push
          fi
