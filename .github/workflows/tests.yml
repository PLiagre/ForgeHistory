name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  atelier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Les tests de l'atelier
        run: python -m pytest tests/ -q
      - name: Les sept couches sont occupées
        run: python -m atelier couches
      - name: fusionner refuse
        run: |
          set +e
          python -m atelier fusionner
          test $? -eq 2
