name: tests

# Deux travaux : le jeu et le regard qui le montre. C'est toute la CI.
#
# Elle ne juge pas un lot, elle ne lit pas de compte-rendu, elle ne fusionne
# rien. Elle dit une seule chose : les tests passent, ou ils ne passent pas.
# Le reste, c'est le propriétaire qui le lit dans le diff.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Les tests du jeu
        run: python -m pytest sim/tests/ -q

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Le regard mince sur le snapshot
        run: python -m pytest viewer/tests/ -q
