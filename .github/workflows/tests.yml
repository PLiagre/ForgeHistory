name: tests

# Cinq travaux :
#   * sim-tests      -- le jeu : invariants physiques, règles visibles, déterminisme
#   * viewer-tests   -- le regard mince : il lit le snapshot sans le réinventer
#   * harness-tests  -- les vérificateurs facultatifs et leurs gardes techniques
#   * control-plane  -- ForgePilot, l'automatisation facultative
#   * f0-demo        -- l'exemple incohérent reste détecté
#
# Pourquoi le brief honnête n'est pas rejoué ici : son ACCEPT dépend des
# dates de fichiers (la rubrique doit précéder les livrables), qu'un
# checkout git écrase. Le chemin ACCEPT est couvert par les fixtures de
# test_verdict_audit.py.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  sim-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Les tests du jeu
        run: python -m pytest sim/tests/ -v

  viewer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Le regard mince sur le snapshot
        run: python -m pytest viewer/tests/ -v

  harness-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - name: Les vérificateurs facultatifs
        run: python -m pytest harness/tests/ -v

  control-plane-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      # pytest est requis : ForgePilot lance les suites du candidat avec
      # `python -m pytest`, et un test l'exerce pour de vrai.
      - run: python -m pip install --upgrade pip pytest
      - name: ForgePilot
        working-directory: control-plane
        run: python -m unittest discover -s tests -v

  f0-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Un compte-rendu incohérent doit être détecté
        run: python harness/demo/fake_brief_001/run_demo.py
