name: pipeline-failure-escalate

# Brief 008, Lot 008b, Success Conditions 9-10 (fixes ARCH-003). Watches all
# four pipeline-*.yml workflows for a FAILURE conclusion -- the exact shape
# of incident run 31085883052 (pipeline-orchestrate, FAILURE, exit 2, no
# ledger/CI/notification of any kind telling anyone the loop had stopped
# watching itself). Dispatches the new `pipeline_job_failed` policy rule
# (harness/pipeline/auto_policy.yaml), which orchestrator.py resolves to
# the same `escalate_pipeline_stuck` action the existing
# three_consecutive_mechanical_rejects rule already returns for a 3-REJECT
# Générateur streak -- so a machine failure and a bad-work streak now earn
# the same human-visible signal, per this brief's own world-terms goal.
#
# Log-only, same wiring depth as that existing escalation path (see
# harness/pipeline/orchestrator.py's own module docstring): no real `gh
# issue create` call here either, matching this brief's Non-Goals. Building
# real issue-opening for either escalation path is separate, future work,
# not promised by this workflow.
#
# `workflow_run` matches by each target workflow's own `name:` key, not its
# filename -- the four names below are exactly the `name:` value at the top
# of each of the four `.github/workflows/pipeline-*.yml` files. None of
# those four files is edited by this workflow's existence: `workflow_run`
# is a GitHub-native "watch another workflow's runs" trigger that needs no
# change inside the watched workflow at all.

on:
  workflow_run:
    workflows:
      - pipeline-audit
      - pipeline-challenge
      - pipeline-orchestrate
      - pipeline-forge-run
    types: [completed]

permissions:
  contents: read

jobs:
  escalate-on-failure:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Dispatch pipeline_job_failed
        env:
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          payload="$(python -c "import json, os; print(json.dumps({'workflow_name': os.environ['WORKFLOW_NAME'], 'run_url': os.environ['RUN_URL'], 'conclusion': os.environ['CONCLUSION']}))")"
          python harness/pipeline/orchestrator.py run --event pipeline_job_failed --payload "$payload"
