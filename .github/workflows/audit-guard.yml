name: audit-guard

# Migration step 8: mechanically enforce the audit contract on every PR.
# Two guards, both deterministic:
#   * schema  -- every audit's frontmatter is valid (flags false, full SHA,
#                id matches filename). Logic lives in harness/audit_schema.py.
#   * scope   -- a Cursor *audit deposit* (files under architecture/inbox/)
#                may touch only that directory. A cursor/* branch that does
#                not deposit an audit is an executor/Cloud PR and is exempt
#                (ADR-0013 / ADR-0016 : Cursor exécute, plus seulement audite).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  audit-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Validate audit frontmatter schema
        run: python harness/audit_schema.py

  cursor-scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'cursor/')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Un dépôt d'audit cursor/ ne sort pas de architecture/inbox/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Changed files:"
          echo "$changed"
          if ! printf '%s\n' "$changed" | grep -q '^architecture/inbox/'; then
            echo "Pas un dépôt d'audit (aucun fichier sous architecture/inbox/). Scope N/A."
            exit 0
          fi
          offending="$(printf '%s\n' "$changed" | grep -v '^architecture/inbox/' || true)"
          if [ -n "$offending" ]; then
            echo "::error::Un dépôt d'audit cursor/ ne peut modifier que architecture/inbox/. Hors périmètre :"
            printf '%s\n' "$offending"
            exit 1
          fi
          echo "Scope OK: dépôt d'audit limité à architecture/inbox/."

  audit-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Vérifier les audits non adjugés ciblant cette PR
        env:
          PR_HEAD_BRANCH: ${{ github.head_ref }}
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python harness/pipeline/pr_audit_guard.py check \
            --head-branch "$PR_HEAD_BRANCH" \
            --head-commit "$PR_HEAD_COMMIT"
