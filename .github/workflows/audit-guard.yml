name: audit-guard

# Migration step 8: schema d'audit (toujours utile, bon marché).
# cursor-scope : seulement un dépôt d'audit sous architecture/inbox/.
# audit-check : HORS CHEMIN PR (ADR-0018) — succès explicite, plus de
# garde d'audits historiques sur une PR produit.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  audit-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Validate audit frontmatter schema
        run: python harness/audit_schema.py

  cursor-scope:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'cursor/')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Un dépôt d'audit cursor/ ne sort pas de architecture/inbox/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "Changed files:"
          echo "$changed"
          if ! printf '%s\n' "$changed" | grep -q '^architecture/inbox/'; then
            echo "Pas un dépôt d'audit (aucun fichier sous architecture/inbox/). Scope N/A."
            exit 0
          fi
          offending="$(printf '%s\n' "$changed" | grep -v '^architecture/inbox/' || true)"
          if [ -n "$offending" ]; then
            echo "::error::Un dépôt d'audit cursor/ ne peut modifier que architecture/inbox/. Hors périmètre :"
            printf '%s\n' "$offending"
            exit 1
          fi
          echo "Scope OK: dépôt d'audit limité à architecture/inbox/."

  audit-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Garde d'audits historiques hors chemin PR (ADR-0018)
        run: |
          echo "ADR-0018 : audit-check n'est plus un check de PR produit."
          echo "La boucle architecture/inbox est historique (ADR-0012 : jalons)."
          echo "Ce job reste nommé pour une protection de branche déjà déclarée ;"
          echo "il ne relit plus les audits non adjugés d'une PR cursor/*."
