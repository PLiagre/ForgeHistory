# .github/merge-bot.yaml
#
# Brief 006, Lot 006b, Success Condition 13. Normative allowlist/denylist
# for automatic merging of BOT-authored pull requests in `mode: full_auto`
# (harness/pipeline/config.yaml). Enforced by
# `.github/workflows/merge-bot.yml` (deliberately NOT named
# `pipeline-*.yml` -- the brief's Required Counter `pipeline_workflows_count`
# must equal exactly 4, one per Success Condition 9-12; this file and its
# workflow are the auto-merge mechanism the same counter table does not
# count, per Success Condition 13's own separate row).
#
# This restates (never paraphrases as a NEW instruction --
# harness/pipeline/config.yaml's `auto_merge_allowlist` /
# `auto_merge_denylist` are the machine-read source; this file is the
# human-facing normative doc + the workflow's own config input) exactly the
# same two lists, so a reader of either file sees the identical boundary.

# A PR is eligible for `gh pr merge --auto` ONLY IF ALL of the following
# hold:
#   1. its head branch matches one of `bot_branches` below;
#   2. every changed path matches at least one entry in `allow_paths`;
#   3. NO changed path matches any entry in `deny_paths` (checked first,
#      and wins even if a path also happens to match an allow_paths glob --
#      deny is not overridable by allow).
bot_branches:
  - "cursor/*"
  - "forge-bot/*"

allow_paths:
  - "architecture/inbox/**"
  - "architecture/reviews/**"
  - "harness/queue/briefs/**/feedback/**"

# Brief 006 Non-Goals, made literal here (not just prose in ADR-0006):
# these paths are NEVER auto-merged, full_auto or not, no matter which
# branch or allow_paths match. A PR touching any of these always stops
# before merge and requires an owner-listed exception recorded in
# docs/adr/0006-full-auto-agent-pipeline.md -- this is a rubric
# disqualifying condition (eval-rubric.md's "Disqualifying failures").
deny_paths:
  - ".github/workflows/**"
  - "harness/verdict_audit.py"
  - "VISION.md"

# Real, verified fact this repo currently has (harness/queue/briefs/006-
# full-auto-agent-pipeline/deliverables/generator-log.md documents the
# exact command run, reproduced twice): `gh api repos/{owner}/{repo}/
# branches/master/protection` returns 403 ("Upgrade to GitHub Pro or make
# this repository public to enable this feature.") -- exactly the brief's
# Acceptable Waivers row 3 ("branch protection empêche auto-merge bot"),
# recorded as a waiver in deliverables/manifest.json. The branch-protection
# FEATURE is unavailable on this repo's current plan, not merely
# unconfigured -- nothing at the GitHub-repository-settings level enforces
# the deny_paths boundary below. That makes this file and
# .github/workflows/merge-bot.yml's own path check (which runs and can
# refuse BEFORE `gh pr merge --auto` is ever attempted -- the "partial
# waiver" this brief row requires) the ONLY enforcement of deny_paths until
# this repo is public or upgraded (see docs/rules/full-auto-pipeline.md §
# Known gap).
