[project]
name = "forgeatelier"
version = "0.1.0"
description = "Infrastructure d'agents pour exécuter des lots. Pas un agent de plus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
atelier = "atelier.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
