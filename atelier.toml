# Branchement sur ForgeAtelier.
# L'atelier ne connaît pas le jeu ; il lit ce fichier.

[projet]
nom = "ForgeHistory"
briefs = "briefs"
tests = "python3 -m pytest sim/tests/ viewer/tests/ outils/tests/ -q"
fumee = "python3 -m sim --ticks 0 --json"
branche_base = "master"
prefixe_branche = "agent/"
# Le registre des lots : la seule représentation qui fait autorité sur
# l'état d'un lot. Le pilote la lit, la CI la valide.
feuille = "ROADMAP.md"

[roles]
ecriture = "claude"
execution = "cursor"
controle = "claude"

# L'intégration : qui entre dans master, et à quelle condition. Elle est
# déclarée ici, en clair, parce qu'un réglage qui ne vit que dans les
# options GitHub ne se lit dans aucun diff — et une porte qu'on ne voit
# pas s'ouvrir est une porte qu'on ne se souvient pas d'avoir ouverte.
[integration]
# Les contrôles obligatoires. Une PR entre quand ils sont tous verts sur
# sa révision courante. Un contrôle absent n'est pas un contrôle vert.
#
# `relecture` n'est pas dans la liste, et ce n'est pas un oubli : l'état
# de ce nom est posé par un travail qui tourne sur le code de la PR, donc
# par du code que la PR peut changer. L'intégration calcule ce verdict-là
# elle-même, avec le module de `master` ; l'état reste ce qui rend la PR
# lisible, il n'est pas ce qui l'ouvre.
controles = ["sim", "viewer", "visualisateur", "outils", "feuille", "gitleaks"]
# Les branches que l'intégration fusionne. Le reste attend le
# propriétaire : une expérience qui passe au vert n'est pas un lot.
branches = ["agent/", "brief/", "feuille/"]

# La page de pilotage : ses seuils et ses fenêtres. Ils sont ici, et pas
# dans le code, parce qu'un seuil qu'on ne peut changer qu'en committant
# `outils/` est un seuil que personne ne change — et un seuil que
# personne ne change finit par ne plus rien vouloir dire.
[tableau]
# Au-delà de ce nombre de tours d'intégration consécutifs sans aucune
# fusion, la page alerte. Dix, parce que l'intégration se réveille à
# chaque fin de contrôle et au moins une fois par heure : dix tours à
# vide, c'est au plus quelques heures de chaîne arrêtée, et c'est en
# dessous de ce qui a coûté deux jours entre le 5 et le 7 septembre 2026
# — quarante tours, quarante `RIEN`, et rien pour le dire.
tours_sans_fusion = 10
# Un brouillon plus vieux que ça est du travail perdu : la chaîne ne
# regarde pas les brouillons, et personne ne se souvient d'en avoir
# laissé un. Deux jours, soit un week-end de moins qu'un oubli complet.
brouillon_jours = 2
# Combien de propositions fermées le journal montre.
journal = 30
# Combien de propositions fermées on lit pour dériver la vélocité et le
# temps de traversée. Plus large que le journal : huit semaines de chaîne
# tiennent rarement dans trente propositions, et une fenêtre trop courte
# ferait paraître neuf un lot dont on n'a pas lu la demande.
historique = 200
# Sur combien de semaines la vélocité se mesure.
semaines = 8
# Combien d'exécutions de l'intégration on lit pour compter les tours à
# vide. Au-delà, on ne compte plus une panne, on compte une histoire.
executions = 100
